# Production config: HTTPS with an HTTP listener that only serves the ACME
# challenge and redirects everything else.
#
# Change agromagnat.uz here if the domain differs — it appears 4 times.

server {
    listen 80;
    server_name agromagnat.uz www.agromagnat.uz;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name agromagnat.uz www.agromagnat.uz;

    ssl_certificate /etc/letsencrypt/live/agromagnat.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/agromagnat.uz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    # Photo uploads: 5 files up to 12 MB each before server-side resizing.
    client_max_body_size 64m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Backend API. The backend serves under /api itself, so no path rewrite.
    location /api {
        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health {
        proxy_pass http://backend:3000/health;
    }

    # Listing photos, served from MinIO. /storage/<bucket>/<key> -> minio/<bucket>/<key>.
    # Keys are immutable (UUID names), so far-future caching is safe.
    location /storage/ {
        proxy_pass http://minio:9000/;
        proxy_set_header Host $host;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Everything else is the Next.js app.
    location / {
        proxy_pass http://web:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
