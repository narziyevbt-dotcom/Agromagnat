# HTTP-only config, used in exactly two situations:
#   1. First boot, before the TLS certificate exists — certbot needs a running
#      HTTP server to answer the ACME challenge.
#   2. Local smoke tests of the production stack.
#
# Never leave this active on a public server once the certificate is issued —
# switch to deploy/nginx/https (the compose default).

server {
    listen 80 default_server;
    server_name _;

    client_max_body_size 64m;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location /api {
        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location = /health {
        proxy_pass http://backend:3000/health;
    }

    location /storage/ {
        proxy_pass http://minio:9000/;
        proxy_set_header Host $host;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        proxy_pass http://web:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
