name: agromagnat

services:
  postgres:
    image: postgres:16-alpine
    container_name: agromagnat-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-agromagnat}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-agromagnat}
      POSTGRES_DB: ${DB_NAME:-agromagnat}
    ports:
      - '${DB_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER:-agromagnat} -d ${DB_NAME:-agromagnat}']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: agromagnat-redis
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: agromagnat-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-agromagnat}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-agromagnat}
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio_data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: creates the "agromagnat" bucket and makes listing photos publicly readable.
  minio-init:
    image: minio/mc:latest
    container_name: agromagnat-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${S3_ACCESS_KEY:-agromagnat} ${S3_SECRET_KEY:-agromagnat} &&
      mc mb --ignore-existing local/${S3_BUCKET:-agromagnat} &&
      mc anonymous set download local/${S3_BUCKET:-agromagnat} &&
      echo 'Bucket ${S3_BUCKET:-agromagnat} ready'
      "

volumes:
  postgres_data:
  redis_data:
  minio_data:
