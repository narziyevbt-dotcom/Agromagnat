# Production stack. Reads configuration from ./.env (see .env.production.example).
#
# Only nginx publishes ports — Postgres, Redis and MinIO are reachable solely on
# the internal network, so a leaked database password alone is not an open door.
#
# NGINX_CONF picks the nginx config directory:
#   ./deploy/nginx/http   before the first certificate exists (and for smoke tests)
#   ./deploy/nginx/https  normal operation (default)
name: agromagnat-prod

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:?set in .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set in .env}
      POSTGRES_DB: ${DB_NAME:?set in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER} -d ${DB_NAME}']
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?set in .env}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?set in .env}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 10s
      timeout: 5s
      retries: 10

  # One-shot: creates the photo bucket and makes it publicly readable.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${S3_ACCESS_KEY} ${S3_SECRET_KEY} &&
      mc mb --ignore-existing local/${S3_BUCKET:-agromagnat} &&
      mc anonymous set download local/${S3_BUCKET:-agromagnat} &&
      echo 'Bucket ready'
      "

  backend:
    build: ./apps/backend
    image: agromagnat/backend:latest
    restart: unless-stopped
    env_file: ${ENV_FILE:-.env}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  web:
    build:
      context: ./apps/web
      args:
        # Inlined into the client bundle at build time — see the Dockerfile.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?set in .env}
        NEXT_PUBLIC_S3_URL: ${NEXT_PUBLIC_S3_URL:?set in .env}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:?set in .env}
    image: agromagnat/web:latest
    restart: unless-stopped
    environment:
      # Server-side fetches go straight to the backend container.
      API_URL: http://backend:3000/api
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
    depends_on:
      - backend

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - '${HTTP_PORT:-80}:80'
      - '${HTTPS_PORT:-443}:443'
    volumes:
      - ${NGINX_CONF:-./deploy/nginx/https}:/etc/nginx/conf.d:ro
      - certbot_certs:/etc/letsencrypt
      - certbot_webroot:/var/www/certbot
    depends_on:
      - web
      - backend

  # Renews certificates twice a day; nginx picks them up on its periodic reload
  # (see docs/DEPLOY.md for the reload cron).
  certbot:
    image: certbot/certbot
    restart: unless-stopped
    volumes:
      - certbot_certs:/etc/letsencrypt
      - certbot_webroot:/var/www/certbot
    entrypoint: >
      /bin/sh -c 'trap exit TERM;
      while :; do certbot renew --webroot -w /var/www/certbot --quiet;
      sleep 12h & wait $${!}; done'

volumes:
  postgres_data:
  redis_data:
  minio_data:
  certbot_certs:
  certbot_webroot:
